<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X AI Reply Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <div class="header">
        <svg class="logo" viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <span class="title">Reply AI</span>
      </div>

      <form id="settings-form" class="form">
        <div class="form-group">
          <label for="api-key">Gemini API Key</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="api-key"
              placeholder="AIzaSy..."
              autocomplete="off"
            />
            <button type="button" id="toggle-key" class="icon-button" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="help-text">Get a key from the <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a>.</span>
        </div>

        <div class="form-group">
          <label for="default-tone">Default Tone</label>
          <select id="default-tone">
            <option value="supportive">🤝 Supportive / Positive</option>
            <option value="witty">⚡ Witty / Humorous</option>
            <option value="professional">💼 Professional / Informative</option>
            <option value="agree">👍 Agree / Validate</option>
            <option value="disagree">🧐 Critical / Counterpoint</option>
          </select>
        </div>

        <button type="submit" id="save-button" class="btn-primary">
          Save Settings
        </button>

        <div id="status" class="status-message"></div>
      </form>
    </div>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
